security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
            logout:
                path: app_logout
                target: app_login

    # RG-05 : droits differencies selon le role, cumulables
    role_hierarchy:
        ROLE_RESPONSABLE: ROLE_EMPLOYE
        ROLE_RH: ROLE_RESPONSABLE
        ROLE_ADMIN: ROLE_RH

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/rh, roles: ROLE_RH }
        - { path: ^/, roles: ROLE_EMPLOYE }